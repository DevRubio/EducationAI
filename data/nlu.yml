version: "3.1"

nlu:
  - intent: saludar
    examples: |
      - hola
      - ola
      - buenos días
      - buenas tardes
      - buenas noches
      - qué tal
      - cómo estás
      - hola asistente
      - oye
      - buenas

  - intent: despedirse
    examples: |
      - adiós
      - hasta luego
      - nos vemos
      - chau
      - bye
      - hasta pronto
      - me retiro

  - intent: agradecer
    examples: |
      - gracias
      - muchas gracias
      - te lo agradezco
      - qué amable
      - excelente, gracias
      - perfecto gracias
      - de mucha ayuda

  - intent: preguntar_sobre_certificacion
