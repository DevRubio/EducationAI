      - Información de la certificación de IA
      - Háblame de la certificación AIF-C01
      - Qué validez tiene el certificado de IA de AWS

  - intent: preguntar_requisitos
    examples: |
      - ¿Cuáles son los requisitos para dar el examen de IA?
      - ¿Quién puede tomar el AWS Certified AI Practitioner?
      - ¿Necesito programar para el examen de IA de AWS?
      - ¿Hay prerrequisitos para el AI Practitioner?
      - ¿Es para principiantes el examen de IA de AWS?
