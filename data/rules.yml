version: "3.1"

rules:
  - rule: regla para saludo y mostrar menú
    steps:
      - intent: saludar
      - action: utter_saludo
      - action: utter_menu

  - rule: regla para despedida
    steps:
      - intent: despedirse
      - action: utter_despedida

  - rule: regla para agradecimiento
    steps:
      - intent: agradecer
      - action: utter_agradecimiento

  - rule: regla para preguntar sobre la certificación
    steps:
      - intent: preguntar_sobre_certificacion
      - action: utter_sobre_certificacion

  - rule: regla para preguntar requisitos
    steps:
      - intent: preguntar_requisitos
      - action: utter_requisitos

  - rule: regla para preguntar detalles del examen
    steps:
      - intent: preguntar_detalles_examen
      - action: utter_detalles_examen

  - rule: regla para preguntar temas del examen
    steps:
      - intent: preguntar_temas
      - action: utter_temas

  - rule: regla para preguntar recursos de estudio
    steps:
      - intent: preguntar_recursos
      - action: utter_recursos

  - rule: regla para preguntar sobre Amazon Bedrock
    steps:
      - intent: preguntar_amazon_bedrock
      - action: utter_amazon_bedrock

  - rule: regla para preguntar sobre Amazon SageMaker
    steps:
      - intent: preguntar_amazon_sagemaker
      - action: utter_amazon_sagemaker

  - rule: regla para preguntar sobre IA Responsable
    steps:
      - intent: preguntar_responsible_ai
      - action: utter_responsible_ai

  - rule: regla para preguntar sobre otros servicios AI
    steps:
      - intent: preguntar_servicios_ai
      - action: utter_servicios_ai

  - rule: Responder usando RAG si el intent no tiene alta confianza (NLU Fallback)
    steps:
      - intent: nlu_fallback
      - action: action_responder_rag

  - rule: regla para responde el creador
    steps:
      - intent: ask_creador
      - action: utter_ask_creador

  - rule: consultar API externa al consultar
    steps:
      - intent: consultar_api
      - action: action_llamar_api

  - rule: Activar formulario de correo 
    steps:
      - intent: finalizar_quiz
      - action: pedir_email_form
      - active_loop: pedir_email_form

  - rule: Enviar correo al completar formulario
    condition: 
      - active_loop: pedir_email_form
    steps:
      - action: pedir_email_form
      - active_loop: null
      - slot_was_set:
        - requested_slot: null
      - action: utter_confirmar_correo

  - rule: Regla para responder diferencias entre AmazonCloudWatch y AWSCloudTrail
    steps:
      - intent: diferencias_AmazonCloudWatch_AWSCloudTrail
      - action: utter_diferencias_AmazonCloudWatch_AWSCloudTrail

